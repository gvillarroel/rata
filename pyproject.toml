[project]
name = "rata-synthetic-data-skills"
version = "0.3.0"
description = "Codex skills for policy-driven synthetic tabular data generation"
requires-python = ">=3.12,<3.14"
license = "Apache-2.0"
dependencies = [
  "fastavro==1.12.2",
  "mostlyai-engine==2.6.2",
  "numpy==2.5.1",
  "pandas==3.0.3",
  "pyarrow==25.0.0",
  "scikit-learn==1.9.0",
  "scipy==1.18.0",
]

[dependency-groups]
dev = [
  "pip-licenses>=5.5,<6",
  "pyyaml==6.0.3",
  "pytest>=9,<10",
  "ruff>=0.14,<1",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
